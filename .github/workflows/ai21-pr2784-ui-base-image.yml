name: ai21-pr2784-ui-base-image

on:
  workflow_dispatch:
  push:
    branches: [ai21/v1.6.0-pr2784-ui-base]

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=v1.6.0-pr2784-ui-agentgateway-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agentgateway:${{ steps.tag.outputs.tag }}
          # UI served at tools.<org>-<env>.ai21.com/agentgateway/ui/ behind a strip-prefix route.
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            GIT_REVISION=${{ github.sha }}
            UI_BASE=/agentgateway/ui/
            UI_API_BASE=/agentgateway
          cache-from: type=gha
          cache-to: type=gha,mode=max
